<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Withdraw — MineCore</title><link rel="stylesheet" href="/style.css"></head><body><script src="/app.js"></script><script>boot("Withdraw",async el=>{const b=await api("/api/balance");el.innerHTML=`<div class="grid2"><div class="card"><h2>Withdraw</h2><div class="notice">Minimum withdrawal: $20. Eligibility is determined server-side using a configured market-price source.</div><form id="wf" class="form" style="margin-top:14px"><select name="currency"><option>BTC</option><option>ETH</option></select><select name="network"><option>Bitcoin</option><option>Ethereum</option></select><input class="input" name="amount" placeholder="Amount in crypto" required><input class="input" name="destinationAddress" placeholder="Destination wallet address" required><label><input type="checkbox" name="confirmation" value="true" required> I have verified the destination address and network are correct.</label><button class="btn">Request Withdrawal</button><div id="msg"></div></form></div><div class="card"><h3>Available Balances</h3>${b.balances.map(x=>`<div style="margin:12px 0"><span class="muted">${x.currency}</span><div class="value">${esc(x.available)}</div></div>`).join("")||"<p class=muted>No verified balance.</p>"}</div></div>`;wf.onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(wf));x.confirmation=x.confirmation==="true";try{await api("/api/withdrawals",{method:"POST",body:JSON.stringify(x)});msg.className="success";msg.textContent="Withdrawal submitted for review."}catch(e){msg.className="error";msg.textContent=e.message}}})</script></body></html>
