<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deposit — MineCore</title><link rel="stylesheet" href="/style.css"></head><body><script src="/app.js"></script><script>boot("Deposit",async el=>{const p=await api("/api/plans");el.innerHTML=`<div class="grid2"><div class="card"><h2>USDT Deposit</h2><p class="muted">Select a plan and network. The server records the configured destination address.</p><select id="plan">${p.plans.map(x=>`<option value="${x.id}">${esc(x.name)} — $${money(x.price_usd)}</option>`).join("")}</select><select id="network" style="margin-top:10px"><option>TRC20</option><option>ERC20</option></select><div id="addr" class="notice" style="margin-top:10px"></div><input id="txid" class="input" placeholder="Transaction ID" style="margin-top:10px"><button class="btn" style="margin-top:10px" id="send">Submit payment</button><div id="msg"></div></div><div class="card"><h3>Important</h3><p class="muted">Always verify the selected network and destination address before sending USDT. A wrong network or address can result in permanent loss.</p></div></div>`;async function update(){try{const r=await fetch("/api/plans");const addrNote=network.value==="TRC20"?"Configured TRC20 address is shown during order creation.":"Configured ERC20 address is shown during order creation.";addr.textContent=addrNote}catch{}}network.onchange=update;send.onclick=async()=>{try{const d=await api("/api/orders",{method:"POST",body:JSON.stringify({planId:plan.value,network:network.value,txid:txid.value})});msg.className="success";msg.textContent="Order submitted and pending verification. Order ID: "+d.order.id}catch(e){msg.className="error";msg.textContent=e.message}};update()})</script></body></html>
