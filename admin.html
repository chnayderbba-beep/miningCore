<!doctype html><html><head><meta charset="utf-8"><meta name="viewport=device-width,initial-scale=1"><title>Admin — MineCore</title><link rel="stylesheet" href="/style.css"></head><body><script src="/app.js"></script><script>boot("Admin",async el=>{const u=await me();if(u.role!=="admin"){el.innerHTML='<div class="card"><h2>Forbidden</h2><p class="muted">Administrator access required.</p></div>';return}const [s,o,w]=await Promise.all([api("/api/admin/stats"),api("/api/admin/orders"),api("/api/admin/withdrawals")]);el.innerHTML=`<div class="grid">${Object.entries(s.stats).map(([k,v])=>`<div class="card"><div class="muted">${esc(k)}</div><div class="value">${esc(v)}</div></div>`).join("")}</div><div class="card" style="margin-top:16px"><h2>Orders</h2><table class="table"><tr><th>User</th><th>Plan</th><th>TXID</th><th>Verify</th><th>Approve</th><th>Reject</th></tr>${o.orders.map(x=>`<tr><td>${esc(x.email)}</td><td>${esc(x.plan_name)}</td><td>${esc(x.transaction_hash||"—")}</td><td><button class="btn secondary" onclick="oa('${x.id}','verify')">Verify</button></td><td><button class="btn" onclick="oa('${x.id}','approve')">Approve</button></td><td><button class="btn danger" onclick="oa('${x.id}','reject')">Reject</button></td></tr>`).join("")}</table></div><div class="card" style="margin-top:16px"><h2>Withdrawals</h2><table class="table"><tr><th>User</th><th>Amount</th><th>Asset</th><th>Status</th><th>Approve</th><th>Reject</th><th>Process</th></tr>${w.withdrawals.map(x=>`<tr><td>${esc(x.email)}</td><td>${esc(x.amount)}</td><td>${esc(x.currency)}</td><td>${esc(x.status)}</td><td><button class="btn" onclick="wa('${x.id}','approve')">Approve</button></td><td><button class="btn danger" onclick="wa('${x.id}','reject')">Reject</button></td><td><button class="btn secondary" onclick="wa('${x.id}','process')">Process</button></td></tr>`).join("")}</table></div><div class="card" style="margin-top:16px"><h2>Management</h2><p class="muted">Users, contracts, plans and audit logs are available through server-authorized admin APIs.</p><div class="grid2"><div><button class="btn secondary" onclick="loadMgmt('users')">Users</button> <button class="btn secondary" onclick="loadMgmt('contracts')">Contracts</button></div><div><button class="btn secondary" onclick="loadMgmt('plans')">Plans</button> <button class="btn secondary" onclick="loadMgmt('audit-logs')">Audit Logs</button></div></div><div id="mgmt" style="margin-top:14px"></div></div>`;window.loadMgmt=async kind=>{const d=await api('/api/admin/'+kind);mgmt.innerHTML='<pre style="white-space:pre-wrap;overflow:auto">'+esc(JSON.stringify(d,null,2))+'</pre>'};window.oa=async(id,action)=>{try{await api("/api/admin/orders-action?id="+id,{method:"POST",body:JSON.stringify({action})});location.reload()}catch(e){alert(e.message)}};window.wa=async(id,action)=>{let reason=action==="reject"?prompt("Rejection reason?"):undefined;try{await api("/api/admin/withdrawal-action?id="+id,{method:"POST",body:JSON.stringify({action,reason})});location.reload()}catch(e){alert(e.message)}}})</script></body></html>
