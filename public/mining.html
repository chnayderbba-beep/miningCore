<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mining — MineCore</title><link rel="stylesheet" href="/style.css"></head><body><script src="/app.js"></script><script>boot("Mining",async el=>{async function load(){const d=await api("/api/mining");if(!d.contracts.length){el.innerHTML='<div class="card"><h2>Payment under review</h2><p class="muted">Your mining plan will become available after your payment has been verified.</p></div>';return}el.innerHTML=d.contracts.map(c=>`<div class="card" style="margin-bottom:16px"><div class="top"><div><h2>${esc(c.plan_name)}</h2><span class="badge ${c.status==="Mining"?"ok":""}">${esc(c.status)}</span></div><div class="muted">${esc(c.mining_speed)}</div></div><div id="c-${c.id}"></div></div>`).join("");d.contracts.forEach(c=>renderContract(c.id))}async function renderContract(id){const box=document.getElementById("c-"+id);let s;try{s=await api("/api/mining/status?id="+id)}catch(e){box.innerHTML='<div class="error">'+esc(e.message)+'</div>';return}if(!s.coin){box.innerHTML=`<div class="notice">Your mining plan is ready! Select BTC or ETH.</div><div style="margin-top:12px"><button class="btn" onclick="selectCoin('${id}','BTC')">Bitcoin (BTC)</button> <button class="btn secondary" onclick="selectCoin('${id}','ETH')">Ethereum (ETH)</button></div>`;return}box.innerHTML=`<div class="grid2"><div><div class="muted">Crypto Mined</div><div class="mining-number">${esc(s.minedAmount)} ${esc(s.coin)}</div></div><div><div class="muted">Current USD Value</div><div class="mining-number">${s.usdValue?("$"+money(s.usdValue)):"—"}</div></div><div><div class="muted">Current ${esc(s.coin)} Price</div><div class="value">${s.marketPriceUsd?("$"+money(s.marketPriceUsd)):"Unavailable"}</div><small class="muted">${s.priceFetchedAt?"Updated "+new Date(s.priceFetchedAt).toLocaleString():""}</small></div><div><div class="muted">Mining Speed</div><div class="value">${esc(s.miningSpeed)}</div></div></div>${s.connected?`<p class="success">Real mining provider connected.</p>`:`<div class="notice">Mining infrastructure is not connected. Live mining production will appear after the mining backend is configured.</div>`}<div style="margin-top:14px">${s.status==="Mining"?`<button class="btn danger" onclick="action('${id}','stop')">STOP MINING</button>`:`<button class="btn" onclick="action('${id}','start')">START MINING</button>`}</div>`}window.selectCoin=async(id,coin)=>{try{await api("/api/mining/select-coin?id="+id,{method:"POST",body:JSON.stringify({coin})});renderContract(id)}catch(e){alert(e.message)}};window.action=async(id,a)=>{try{await api("/api/mining/"+a+"?id="+id,{method:"POST",body:"{}"});renderContract(id)}catch(e){alert(e.message)}};await load();setInterval(async()=>{const d=await api("/api/mining");for(const c of d.contracts) if(c.coin) renderContract(c.id)},10000)})</script></body></html>
