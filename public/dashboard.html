<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — MineCore</title><link rel="stylesheet" href="/style.css"></head><body><script src="/app.js"></script><script>boot("Dashboard",async el=>{const [b,m,w]=await Promise.all([api("/api/balance"),api("/api/mining"),api("/api/withdrawals")]);el.innerHTML=`<div class="grid"><div class="card"><div class="muted">Available Balance</div><div class="value">${b.balances.map(x=>`${money(x.available)} ${x.currency}`).join("<br>")||"0.00"}</div></div><div class="card"><div class="muted">Active Contracts</div><div class="value">${m.contracts.filter(x=>x.status==="Mining").length}</div></div><div class="card"><div class="muted">Pending Withdrawals</div><div class="value">${w.withdrawals.filter(x=>["Pending","Under Review"].includes(x.status)).length}</div></div><div class="card"><div class="muted">Contracts</div><div class="value">${m.contracts.length}</div></div></div><div class="card" style="margin-top:16px"><h3>Mining Contracts</h3><table class="table"><tr><th>Plan</th><th>Coin</th><th>Speed</th><th>Status</th></tr>${m.contracts.map(c=>`<tr><td>${esc(c.plan_name)}</td><td>${esc(c.coin||"—")}</td><td>${esc(c.mining_speed)}</td><td><span class="badge">${esc(c.status)}</span></td></tr>`).join("")||"<tr><td colspan=4 class=muted>No contracts yet.</td></tr>"}</table></div>`})</script></body></html>
