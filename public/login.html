<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — MineCore</title><link rel="stylesheet" href="/style.css"></head><body class="public"><div class="card" style="max-width:440px;margin:80px auto"><h1>Sign in</h1><p class="muted">Access your MineCore account.</p><form id="f" class="form"><input class="input" name="email" type="email" placeholder="Email" required><input class="input" name="password" type="password" placeholder="Password" required><button class="btn">Login</button><div id="msg"></div></form><p class="muted">No account? <a href="/signup.html">Create one</a></p></div><script src="/app.js"></script><script>f.onsubmit=async e=>{e.preventDefault();msg.textContent="";try{await api("/api/auth/login",{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(f)))});location.href="/dashboard.html"}catch(x){msg.className="error";msg.textContent=x.message}}</script></body></html>
