<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up — MineCore</title><link rel="stylesheet" href="/style.css"></head><body class="public"><div class="card" style="max-width:520px;margin:50px auto"><h1>Create account</h1><form id="f" class="form"><input class="input" name="fullName" placeholder="Full name" required><input class="input" name="username" placeholder="Username" required><input class="input" name="email" type="email" placeholder="Email" required><input class="input" name="password" type="password" placeholder="Password (10+ characters)" required><input class="input" name="confirmPassword" type="password" placeholder="Confirm password" required><button class="btn">Create Account</button><div id="msg"></div></form><p class="muted">Already registered? <a href="/login.html">Login</a></p></div><script src="/app.js"></script><script>f.onsubmit=async e=>{e.preventDefault();try{await api("/api/auth/register",{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(f)))});location.href="/dashboard.html"}catch(x){msg.className="error";msg.textContent=x.message}}</script></body></html>
