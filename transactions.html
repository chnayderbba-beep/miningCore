<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transactions — MineCore</title><link rel="stylesheet" href="/style.css"></head><body><script src="/app.js"></script><script>boot("Transactions",async el=>{const d=await api("/api/transactions");el.innerHTML=`<div class="card"><h2>Ledger</h2><table class="table"><tr><th>Date</th><th>Type</th><th>Currency</th><th>Amount</th><th>Description</th></tr>${d.transactions.map(t=>`<tr><td>${new Date(t.created_at).toLocaleString()}</td><td>${esc(t.type)}</td><td>${esc(t.currency)}</td><td>${esc(t.amount)}</td><td>${esc(t.description)}</td></tr>`).join("")||"<tr><td colspan=5 class=muted>No transactions.</td></tr>"}</table></div>`})</script></body></html>
