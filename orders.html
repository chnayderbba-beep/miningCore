<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders — MineCore</title><link rel="stylesheet" href="/style.css"></head><body><script src="/app.js"></script><script>boot("Orders",async el=>{const d=await api("/api/orders");el.innerHTML=`<div class="card"><h2>Orders</h2><table class="table"><tr><th>ID</th><th>Plan</th><th>Amount</th><th>Network</th><th>TXID</th><th>Status</th></tr>${d.orders.map(o=>`<tr><td>${esc(o.id.slice(0,8))}</td><td>${esc(o.plan_name)}</td><td>$${money(o.amount_usd)}</td><td>${esc(o.network)}</td><td>${esc(o.transaction_hash||"—")}</td><td><span class="badge">${esc(o.status)}</span></td></tr>`).join("")||"<tr><td colspan=6 class=muted>No orders.</td></tr>"}</table></div>`})</script></body></html>
