<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plans — MineCore</title><link rel="stylesheet" href="/style.css"></head><body class="public"><div style="max-width:1100px;margin:auto"><div class="top"><div class="brand">Mine<span style="color:var(--green)">Core</span></div><a class="btn secondary" href="/login.html">Login</a></div><h1>Mining Plans</h1><p class="muted">Prices and speeds are administrator-configurable. They are not guarantees of mining output or returns.</p><div id="plans" class="cards"></div></div><script src="/app.js"></script><script>(async()=>{try{const d=await api("/api/plans");plans.innerHTML=d.plans.map(p=>`<div class="card"><h2>${esc(p.name)}</h2><div class="value">$${money(p.price_usd)}</div><p>${esc(p.mining_speed)} · ${p.duration_days} days</p><p class="muted">${esc(p.description)}</p><a class="btn" href="/signup.html">Get Started</a></div>`).join("")}catch(e){plans.textContent=e.message}})()</script></body></html>
